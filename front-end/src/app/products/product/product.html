<mat-card>
    @if (product(); as p) {
    <h3>{{ p.title }}</h3>
    <p>{{ p.description }}</p>

    @if (id()) {
    <button mat-raised-button color="primary" routerLink="/products">
        Назад
    </button>
    }
    } @else {
    <div class="loading-shade">
        <mat-spinner></mat-spinner>
    </div>
    }
</mat-card>
