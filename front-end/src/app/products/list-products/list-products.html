<ng-container>
    <button mat-raised-button color="accent" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon> Добави продукт
    </button>
    @for (product of products(); track product.id) {
    <app-product [item]="product" />
    <div class="actions">
        <button mat-flat-button color="primary" [routerLink]="['/products', product.id]">
            Виж детайли
        </button>
    </div>
    } @empty {
    <mat-card>Няма налични продукти</mat-card>
    }
</ng-container>
