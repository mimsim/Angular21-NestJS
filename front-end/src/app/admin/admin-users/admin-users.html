<div class="admin-container">
    <div class="table-header">
        <h1>Управление на потребители</h1>
        <button mat-fab extended color="primary" (click)="userService.fetchUsers()" [disabled]="isLoading()">
            <mat-icon>refresh</mat-icon>
            Опресни
        </button>
    </div>

    @if (isLoading()) {
    <div class="spinner-container">
        <mat-spinner diameter="50"></mat-spinner>
    </div>
    } @else {
    <div class="mat-elevation-z8 table-responsive">
        <table mat-table [dataSource]="users()">

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let user"> {{user.id}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> Имейл </th>
                <td mat-cell *matCellDef="let user"> {{user.email}} </td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef> Роля </th>
                <td mat-cell *matCellDef="let user">
                    <mat-chip-set>
                        <mat-chip [class.admin-chip]="user.admin">
                            {{ user.admin ? 'Админ' : 'Потребител' }}
                        </mat-chip>
                    </mat-chip-set>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Действия </th>
                <td mat-cell *matCellDef="let user">
                    <button mat-icon-button color="warn" (click)="deleteUser(user.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">Няма намерени потребители в базата.</td>
            </tr>
        </table>
    </div>
    }
</div>
